server:
  port: 2335
  address: 127.0.0.1

lavalink:
  plugins:
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
    - dependency: "com.github.topi314.sponsorblock:sponsorblock-plugin:3.0.1"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasearch:lavasearch-plugin:1.0.0"
      repository: "https://maven.lavalink.dev/releases"

  server:
    password: "glizhmusicpassword123"
    sources:
      youtube: false # Deshabilitado para usar el plugin
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 150
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  lavasrc:
    providers:
      - "dzisrc:%ISRC%"           # Deezer ISRC lookup (mejor match de calidad)
      - "ytsearch:\"%ISRC%\""     # YouTube por ISRC
      - "ytsearch:%QUERY%"        # YouTube por nombre
      - "scsearch:%QUERY%"        # SoundCloud como fallback
    sources:
      spotify: true
      applemusic: true
      deezer: true                 # Activado para dzisrc: provider
      yandexmusic: false
      floweryts: false
      youtube: true
      tidal: true
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET}"
      countryCode: "US"
      playlistLoadLimit: 150
      albumLoadLimit: 150
    applemusic:
      countryCode: "US"
      mediaUserToken: "${APPLE_MUSIC_MEDIA_USER_TOKEN}"
    deezer:
      masterDecryptionKey: "g4el58wc"
    tidal:
      countryCode: "US"
      token: "${TIDAL_CLIENT_ID:${TIDAL_TOKEN:}}"
    genius:
      accessToken: "${GENIUS_TOKEN}"
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
    clients:
      - MUSIC
      - ANDROID
      - WEB
      - WEBEMBEDDED

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: ./logs/Lavalink.log
  level:
    root: INFO
    lavalink: INFO
