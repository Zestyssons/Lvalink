server:
  port: 2335
  address: 127.0.0.1

lavalink:
  plugins:
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.sponsorblock:sponsorblock-plugin:3.0.1"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasearch:lavasearch-plugin:1.0.0"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavalyrics:lavalyrics-plugin:1.1.0"
      repository: "https://maven.lavalink.dev/releases"

  server:
    password: "glizhmusicpassword123"
    sources:
      youtube: false # Deshabilitado para usar el plugin
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 150
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""      # YouTube ISRC (Prioritario y estable por OAuth)
      - "ytsearch:%QUERY%"         # YouTube búsqueda (Prioritario y estable por OAuth)
      - "scsearch:%QUERY%"         # SoundCloud fallback
    sources:
      spotify: true
      applemusic: true
      deezer: false
      yandexmusic: false
      floweryts: false
      youtube: true
      tidal: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET}"
      countryCode: "US"
      playlistLoadLimit: 150
      albumLoadLimit: 150
    applemusic:
      countryCode: "US"
      mediaUserToken: "${APPLE_MUSIC_MEDIA_USER_TOKEN}"
    deezer:
      masterDecryptionKey: "g4el58wc"
      arl: "${DEEZER_ARL}"
    tidal:
      countryCode: "US"
      token: "${TIDAL_CLIENT_ID:${TIDAL_TOKEN:}}"
    genius:
      accessToken: "${GENIUS_TOKEN}"
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
    oauth:
      enabled: false
      skipInitialization: true
      refreshToken: ${YOUTUBE_REFRESH_TOKEN:null}
    clients:
      - MUSIC
      - WEB
      - WEBEMBEDDED
      - ANDROID_VR
      - TV
      - TVHTML5_SIMPLY
  lavalyrics:
    sources:
      - genius    # Usa tu Genius API existente
      - lrclib    # Gratis, sin API key necesaria
    countryCode: US
  skybot:
    sources:
      deezer: true        # Alternativa gratis a Spotify
      applemusic: true    # Apple Music gratis
      getyarn: false      # Memes de audio (opcional)
  lavadspx:
    enabled: true         # Efectos de audio mejorados

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: ./logs/Lavalink.log
  level:
    root: INFO
    lavalink: INFO
