<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glizh Lavalink Node Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0b05;
            --primary: #ffd166; /* Warm yellow/gold */
            --accent: #ff9f1c; /* Amber/orange */
            --success: #00f5d4; /* Operational status cyan/green */
            --text: #f8f9fa;
            --card-bg: rgba(18, 13, 7, 0.55); /* Warm chocolate glassmorphism */
            --card-border: rgba(255, 209, 102, 0.15); /* Soft gold border */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient blurred background image */
        .bg-ambient {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background: linear-gradient(rgba(15, 11, 5, 0.78), rgba(26, 18, 8, 0.78)), url('background.jpg') no-repeat center center;
            background-size: cover;
            filter: blur(15px); /* Soft premium blur */
            transform: scale(1.05); /* Avoid white edges */
            z-index: 1;
        }

        /* Abstract glowing backgrounds */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: var(--accent);
            filter: blur(180px);
            opacity: 0.15;
            z-index: 2;
            animation: pulse 12s infinite alternate;
        }

        body::before {
            top: -10%;
            left: -10%;
        }

        body::after {
            bottom: -10%;
            right: -10%;
            background: var(--primary);
            animation-delay: 6s;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.15) translate(20px, 20px); }
        }

        .container {
            z-index: 2;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 30px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 209, 102, 0.35);
        }

        .logo-container {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
        }

        .logo {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(255, 159, 28, 0.4);
            animation: float 4s ease-in-out infinite;
            padding: 2px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            overflow: hidden;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ffd166 0%, #fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 245, 212, 0.1);
            border: 1px solid rgba(0, 245, 212, 0.2);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: var(--success);
            margin-bottom: 25px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .divider {
            height: 1px;
            background: var(--card-border);
            margin: 25px 0;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            text-align: left;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 15px;
        }

        .info-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="bg-ambient"></div>
    <div class="container">
        <div class="card">
            <div class="logo-container">
                <div class="logo">
                    <img src="background.jpg" class="logo-img" alt="Glizh Logo">
                </div>
            </div>
            <h1>Glizh Lavalink Node</h1>
            <p class="subtitle">Servidor Privado de Alto Rendimiento</p>
            
            <div class="status-badge">
                <div class="status-dot"></div>
                Sistema Operativo
            </div>

            <div class="divider"></div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Proveedor</div>
                    <div class="info-value">Render Cloud</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Versión</div>
                    <div class="info-value">Lavalink v4.2.2</div>
                </div>
                <div class="info-item">
                    <div class="info-label">UptimeRobot</div>
                    <div class="info-value">Compatible (200 OK)</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Seguridad</div>
                    <div class="info-value">SSL / OAuth2</div>
                </div>
            </div>
        </div>
        <p class="footer">© 2026 Glizh Music. Todos los derechos reservados.</p>
    </div>
</body>
</html>
